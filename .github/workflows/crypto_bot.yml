name: Tier-List Screener Bot

on:
  schedule:
    # Jalan setiap 15 menit (00, 15, 30, 45)
    - cron: '*/15 * * * *'
  
  workflow_dispatch: # Tombol manual "Run" untuk tes sewaktu-waktu

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener Engine
        env:
          # Pastikan Secret ini sudah ada di Settings > Secrets and variables > Actions
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
