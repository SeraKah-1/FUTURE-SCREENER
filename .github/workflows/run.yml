name: Network Debugger

on:
  workflow_dispatch: # Hanya jalan kalau dipencet manual

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Libraries
        run: pip install ccxt requests
      - name: Run Network Test
        run: python debug_network.py
